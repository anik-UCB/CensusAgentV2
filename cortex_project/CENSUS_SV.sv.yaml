verified_queries:
  - name: top_populated_states
    question: What are the top 10 most populated states?
    sql: SELECT STATE_NAME, TOTAL_POPULATION FROM v_state_summary ORDER BY TOTAL_POPULATION
      DESC LIMIT 10
    verified_at: 1785560783
    verified_by: Manual
  - name: highest_income_states
    question: Which states have the highest median household income?
    sql: SELECT STATE_NAME, MEDIAN_HOUSEHOLD_INCOME FROM v_state_income ORDER BY MEDIAN_HOUSEHOLD_INCOME
      DESC LIMIT 5
    verified_at: 1785560783
    verified_by: Manual
  - name: highest_unemployment
    question: Which states have the highest unemployment rate?
    sql: SELECT STATE_NAME, UNEMPLOYMENT_RATE FROM v_state_employment ORDER BY UNEMPLOYMENT_RATE
      DESC LIMIT 10
    verified_at: 1785560783
    verified_by: Manual
  - name: highest_education
    question: Which states have the highest percentage of people with a bachelors
      degree?
    sql: SELECT STATE_NAME, PCT_BACHELORS FROM v_state_education ORDER BY PCT_BACHELORS
      DESC LIMIT 5
    verified_at: 1785560783
    verified_by: Manual
  - name: highest_poverty
    question: What are the poorest states by poverty rate?
    sql: SELECT STATE_NAME, POVERTY_RATE FROM v_state_poverty ORDER BY POVERTY_RATE
      DESC LIMIT 10
    verified_at: 1785560783
    verified_by: Manual
  - name: income_top_populated
    question: Compare median income across the top 5 most populated states
    sql: SELECT STATE_NAME, TOTAL_POPULATION, MEDIAN_HOUSEHOLD_INCOME FROM v_state_income
      ORDER BY TOTAL_POPULATION DESC LIMIT 5
    verified_at: 1785560783
    verified_by: Manual
  - name: poverty_vs_education_by_state
    question: Which states have both high poverty rates and low education levels?
    sql: SELECT p.STATE_NAME, p.POVERTY_RATE, e.PCT_BACHELORS FROM v_state_poverty
      p JOIN v_state_education e ON p.STATE_NAME = e.STATE_NAME ORDER BY p.POVERTY_RATE
      DESC LIMIT 10
    verified_at: 1785560783
    verified_by: Manual
  - name: income_vs_uninsured_by_state
    question: How does median income relate to uninsured rates across states?
    sql: SELECT i.STATE_NAME, i.MEDIAN_HOUSEHOLD_INCOME, h.UNINSURED_RATE FROM v_state_income
      i JOIN v_state_health_insurance h ON i.STATE_NAME = h.STATE_NAME ORDER BY h.UNINSURED_RATE
      DESC LIMIT 10
    verified_at: 1785560783
    verified_by: Manual
  - name: county_income_education_texas
    question: Compare median income and education across Texas counties
    sql: SELECT i.COUNTY, i.AVG_MEDIAN_HOUSEHOLD_INCOME, e.PCT_BACHELORS FROM v_income
      i JOIN v_education e ON i.STATE_NAME = e.STATE_NAME AND i.COUNTY = e.COUNTY
      WHERE i.STATE_NAME = 'Texas' ORDER BY i.AVG_MEDIAN_HOUSEHOLD_INCOME DESC LIMIT
      10
    verified_at: 1785560783
    verified_by: Manual
  - name: snap_vs_poverty_by_state
    question: Which states have the highest SNAP enrollment relative to their poverty
      population?
    sql: SELECT s.STATE_NAME, s.SNAP_HOUSEHOLDS, p.BELOW_POVERTY_LEVEL, p.POVERTY_RATE
      FROM v_state_snap s JOIN v_state_poverty p ON s.STATE_NAME = p.STATE_NAME ORDER
      BY s.SNAP_HOUSEHOLDS DESC LIMIT 10
    verified_at: 1785560783
    verified_by: Manual
  - name: state_to_county_drilldown
    question: Show California's top 5 counties by population
    sql: SELECT c.COUNTY, c.TOTAL_POPULATION FROM v_population c WHERE c.STATE_NAME
      = 'California' ORDER BY c.TOTAL_POPULATION DESC LIMIT 5
    verified_at: 1785560783
    verified_by: Manual
