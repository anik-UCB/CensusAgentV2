verified_queries:
  - name: top_populated_states
    question: What are the top 10 most populated states?
    sql: SELECT STATE_NAME, TOTAL_POPULATION FROM v_state_summary ORDER BY TOTAL_POPULATION DESC LIMIT 10
    verified_at: 1785560783
    verified_by: Manual
  - name: highest_income_states
    question: Which states have the highest median household income?
    sql: SELECT STATE_NAME, MEDIAN_HOUSEHOLD_INCOME FROM v_state_income ORDER BY MEDIAN_HOUSEHOLD_INCOME DESC LIMIT 5
    verified_at: 1785560783
    verified_by: Manual
  - name: highest_unemployment
    question: Which states have the highest unemployment rate?
    sql: SELECT STATE_NAME, UNEMPLOYMENT_RATE FROM v_state_employment ORDER BY UNEMPLOYMENT_RATE DESC LIMIT 10
    verified_at: 1785560783
    verified_by: Manual
  - name: highest_education
    question: Which states have the highest percentage of people with a bachelors degree?
    sql: SELECT STATE_NAME, PCT_BACHELORS FROM v_state_education ORDER BY PCT_BACHELORS DESC LIMIT 5
    verified_at: 1785560783
    verified_by: Manual
  - name: highest_poverty
    question: What are the poorest states by poverty rate?
    sql: SELECT STATE_NAME, POVERTY_RATE FROM v_state_poverty ORDER BY POVERTY_RATE DESC LIMIT 10
    verified_at: 1785560783
    verified_by: Manual
  - name: income_top_populated
    question: Compare median income across the top 5 most populated states
    sql: SELECT STATE_NAME, TOTAL_POPULATION, MEDIAN_HOUSEHOLD_INCOME FROM v_state_income ORDER BY TOTAL_POPULATION DESC LIMIT 5
    verified_at: 1785560783
    verified_by: Manual