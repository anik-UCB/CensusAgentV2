name: CENSUS_SV
description: US Census American Community Survey (ACS) 2020 data aggregated at the state level. Covers population demographics, income, employment, education, housing, commuting, poverty, health insurance, internet access, language, household type, veterans, and SNAP benefits for all 50 US states plus DC and Puerto Rico.
tables:
  - name: V_STATE_SUMMARY
    base_table:
      database: CENSUS_AGENT
      schema: PUBLIC
      table: V_STATE_SUMMARY
    primary_key:
      columns:
        - STATE_NAME
    dimensions:
      - name: STATE_NAME
        expr: STATE_NAME
        data_type: VARCHAR
        description: Two-letter US state abbreviation (e.g. CA, TX, NY)
      - name: STATE_FIPS
        expr: STATE_FIPS
        data_type: VARCHAR
        description: Two-digit FIPS state code
    facts:
      - name: TOTAL_POPULATION
        expr: TOTAL_POPULATION
        data_type: FLOAT
        description: Total population of the state
      - name: MALE_POPULATION
        expr: MALE_POPULATION
        data_type: FLOAT
      - name: FEMALE_POPULATION
        expr: FEMALE_POPULATION
        data_type: FLOAT
