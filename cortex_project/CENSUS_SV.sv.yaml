name: CENSUS_SV
description: US Census American Community Survey (ACS) 2020 data aggregated at the
  state level. Covers population demographics, income, employment, education, housing,
  commuting, poverty, health insurance, internet access, language, household type,
  veterans, and SNAP benefits for all 50 US states plus DC and Puerto Rico.
tables:
  - name: V_STATE_SUMMARY
    base_table:
      database: CENSUS_AGENT
      schema: PUBLIC
      table: V_STATE_SUMMARY
    primary_key:
      columns:
        - STATE_NAME
    dimensions:
      - name: STATE_NAME
        description: Two-letter US state abbreviation (e.g. CA, TX, NY)
        expr: STATE_NAME
        data_type: VARCHAR
      - name: STATE_FIPS
        description: Two-digit FIPS state code
        expr: STATE_FIPS
        data_type: VARCHAR
    facts:
      - name: TOTAL_POPULATION
        description: Total population of the state
        expr: TOTAL_POPULATION
        data_type: FLOAT
      - name: MALE_POPULATION
        expr: MALE_POPULATION
        data_type: FLOAT
      - name: FEMALE_POPULATION
        expr: FEMALE_POPULATION
        data_type: FLOAT
      - name: POP_UNDER_18
        expr: POP_UNDER_18
        data_type: FLOAT
      - name: POP_18_TO_34
        expr: POP_18_TO_34
        data_type: FLOAT
      - name: POP_35_TO_54
        expr: POP_35_TO_54
        data_type: FLOAT
      - name: POP_55_TO_69
        expr: POP_55_TO_69
        data_type: FLOAT
      - name: POP_70_PLUS
        expr: POP_70_PLUS
        data_type: FLOAT
      - name: WHITE_NON_HISPANIC
        expr: WHITE_NON_HISPANIC
        data_type: FLOAT
      - name: BLACK_NON_HISPANIC
        expr: BLACK_NON_HISPANIC
        data_type: FLOAT
      - name: ASIAN_NON_HISPANIC
        expr: ASIAN_NON_HISPANIC
        data_type: FLOAT
      - name: HISPANIC_LATINO
        expr: HISPANIC_LATINO
        data_type: FLOAT
